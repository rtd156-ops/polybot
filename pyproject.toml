[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "1.0.0"
description = "Polymarket scanner / paper-trading bot with a live-ready core (V1: analysis + paper)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
live = ["py-clob-client>=0.17", "web3>=6.0"]

[tool.setuptools]
packages = ["polybot", "polybot.clients", "polybot.execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
